<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Chess3D — Three.js Chess vs Offline AI</title>
<meta name="description" content="A cinematic 3D chess game rendered with Three.js, playing against a fully offline AI opponent. No server, no API, no network." />
<meta name="theme-color" content="#08090c" />
<meta name="color-scheme" content="dark" />

<link rel="stylesheet" href="./styles.css" />

<!--
  Every dependency is resolved from this repository, never from a CDN, which is
  what keeps the game fully offline. The import map is what lets the source use
  the conventional bare specifiers ("three", "three/addons/...") while the files
  themselves live under ./vendor.

  Note: import maps do NOT apply inside Web Workers. The AI worker therefore
  imports only relative paths, and neither the engine nor the search has any
  Three.js dependency — intentional, so the worker needs no map of its own.
-->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%9E%3C/text%3E%3C/svg%3E" />
</head>
<body>

<canvas id="scene" aria-label="3D chess board"></canvas>

<!-- The HUD builds all of its own markup into this container. -->
<div id="ui"></div>

<!-- Loading screen; removed by src/main.js once the first frame is rendered. -->
<div id="loader">
  <div class="loader-mark">&#9822;</div>
  <div class="loader-title">Chess3D</div>
  <div class="loader-bar"><span></span></div>
  <div class="loader-note" id="loader-note">Starting</div>
</div>

<noscript>
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#e9e6df;font-family:system-ui,sans-serif;text-align:center;padding:24px;">
    Chess3D needs JavaScript and WebGL to render the board.
  </div>
</noscript>

<script type="module" src="./src/main.js"></script>

</body>
</html>
